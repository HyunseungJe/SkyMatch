[project]
name = "skymatch-ml"
version = "0.1.0"
description = "Sky Match: synthetic sky dataset generation and training"
requires-python = ">=3.12"
dependencies = [
    "moderngl>=5.13",
    "glcontext>=3.1",
    "numpy>=2.3",
    "pillow>=11",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["skymatch_ml"]

[dependency-groups]
# Training only (uv sync --group train). Dataset generation does not need these.
train = ["torch>=2.8", "torchvision>=0.23", "onnx>=1.18", "onnxscript>=0.3"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
