<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sky Match</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="sky"></canvas>
    <div id="panel">
      <label>프리셋 <select id="preset"></select></label>
      <button id="reset" type="button" title="현재 프리셋 값으로 되돌립니다">되돌리기</button>
      <span id="stats"></span>
      <button id="scene-toggle" type="button" aria-pressed="false">장면 미리보기</button>
      <label id="scene-picker" hidden title="WASD 이동 · Q/E 높이 · Shift 빠르게 · 드래그 시선 · 휠 이동 속도">장면 <select id="scene-content"></select></label>
    </div>
    <div id="export">
      <button id="save-theta" type="button" title="지금 하늘의 파라미터를 JSON으로 저장합니다 (Blender·Godot·Unity에서 불러옴)">하늘 JSON 저장</button>
      <button id="open-theta" type="button" title="저장한 하늘 JSON을 불러옵니다">불러오기</button>
      <input id="theta-file" type="file" accept=".json,application/json" hidden />
      <span class="divider"></span>
      <label>EXR <select id="exr-target"></select></label>
      <select id="exr-size" title="파노라마 크기 (가로×세로)">
        <option value="8192">8192×4096</option>
        <option value="4096">4096×2048</option>
      </select>
      <button id="export-exr" type="button" title="지금 하늘을 선형 HDR 파노라마(OpenEXR)로 굽습니다">EXR 내보내기</button>
      <span id="export-status"></span>
    </div>
    <aside id="params"></aside>
    <div id="status">하늘 셰이더를 준비하는 중입니다…</div>
    <pre id="bench" hidden></pre>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
